[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tess-memory"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Tess Memory: long-term memory for AI agents. Ingests session transcripts into a multi-timescale, importance-weighted store with a personal core and a durable plan board, served over MCP."
requires-python = ">=3.12,<3.14"
dependencies = [
    "tess-core[chatgpt-account,desktop-credentials]>=0.1.0",
    "mcp>=1.2",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "backports-zstd>=1.0",
]

[project.scripts]
tess-memory = "tess_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tess_memory"]

# The engine is pinned to an exact commit. To work on both at once, install a
# local checkout over the pin after syncing: uv pip install -e ../../agents/tess-core
[tool.uv.sources]
tess-core = { git = "https://github.com/drost-ai/tess-core.git", rev = "e0fcc9497f42ad7b74c102fb98e194cdc94bc629" }

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "pyyaml>=6"]
