[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-memory"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Agentic memory system: ingests Claude Code session transcripts into a multi-timescale, importance-weighted memory store, served over MCP."
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.2",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "backports-zstd>=1.0",
]

[project.scripts]
agentic-memory = "agentic_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_memory"]
